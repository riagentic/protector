<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Protector">
  <title>Protector</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121a23"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- shield: the guard -->
  <path d="M256 72 L408 128 V250 C408 342 344 410 256 444 C168 410 104 342 104 250 V128 Z"
        fill="#2dd4bf" fill-opacity=".12" stroke="url(#shield)" stroke-width="28" stroke-linejoin="round"/>
  <!-- pulse: the machine kept alive -->
  <path d="M136 262 H202 L228 202 L262 322 L290 236 L306 262 H376"
        fill="none" stroke="#e6fffb" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
